name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          mkdir proj
          unzip -o PinGallery.zip -d proj
          find proj -maxdepth 2
          D=$(dirname "$(find proj -name settings.gradle.kts | head -n 1)")
          cd "$D"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PinGallery-apk
          path: proj/**/app-debug.apk
