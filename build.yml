          import coil.compose.AsyncImage
          import kotlinx.coroutines.launch

          @Composable
          fun WallTheme(content: @Composable () -> Unit) {
              val dark = isSystemInDarkTheme()
              val ctx = LocalContext.current
              val scheme = when {
                  Build.VERSION.SDK_INT >= Build.VERSION_CODES.S ->
                      if (dark) dynamicDarkColorScheme(ctx) else dynamicLightColorScheme(ctx)
                  dark -> darkColorScheme()
                  else -> lightColorScheme()
              }
              MaterialTheme(colorScheme = scheme, content = content)
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun App(vm: MainViewModel = viewModel()) {
              var selected by remember { mutableStateOf<Wallpaper?>(null) }
              val focus = LocalFocusManager.current
              val grid = rememberLazyStaggeredGridState()

              // Balik ke atas tiap kali pencarian/sumber berganti.
              LaunchedEffect(vm.refreshKey) {
                  grid.scrollToItem(0)
              }

              // Infinite scroll: muat halaman berikutnya saat mendekati ujung daftar.
              LaunchedEffect(grid, vm.items.size) {
                  snapshotFlow { grid.layoutInfo.visibleItemsInfo.lastOrNull()?.index ?: 0 }
                      .collect { last ->
                          if (last >= vm.items.size - 6) vm.loadMore()
                      }
              }

              Scaffold(
                  topBar = {
                      Column(
                          Modifier
                              .statusBarsPadding()
                              .padding(horizontal = 12.dp, vertical = 8.dp)
                      ) {
                          OutlinedTextField(
                              value = vm.query,
                              onValueChange = { vm.query = it },
                              modifier = Modifier.fillMaxWidth(),
                              singleLine = true,
                              placeholder = { Text("Cari wallpaper…") },
                              shape = RoundedCornerShape(28.dp),
                              keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                              keyboardActions = KeyboardActions(onSearch = {
                                  focus.clearFocus()
                                  vm.refresh()
                              })
                          )
                          Row(
                              Modifier
                                  .horizontalScroll(rememberScrollState())
                                  .padding(top = 8.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              vm.sources.forEach { s ->
                                  FilterChip(
                                      selected = s == vm.source,
                                      onClick = { vm.select(s) },
                                      label = { Text(s.name) }
                                  )
                              }
                              FilterChip(
                                  selected = vm.portrait,
                                  onClick = { vm.togglePortrait() },
                                  label = { Text("Portrait") }
                              )
                          }
                      }
                  }
              ) { pad ->
                  Box(
                      Modifier
                          .padding(pad)
                          .fillMaxSize()
                  ) {
                      LazyVerticalStaggeredGrid(
                          columns = StaggeredGridCells.Fixed(2),
                          state = grid,
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(8.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalItemSpacing = 8.dp
                      ) {
                          items(vm.items, key = { it.id }) { w ->
                              val ratio = if (w.width > 0 && w.height > 0) {
                                  (w.width.toFloat() / w.height).coerceIn(0.4f, 1.6f)
                              } else {
                                  0.66f
                              }
                              AsyncImage(
                                  model = w.thumb,
                                  contentDescription = w.author,
                                  contentScale = ContentScale.Crop,
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .aspectRatio(ratio)
                                      .clip(RoundedCornerShape(12.dp))
                                      .clickable { selected = w }
                              )
                          }
                      }

                      vm.error?.let { msg ->
                          Column(
                              Modifier
                                  .align(Alignment.Center)
                                  .padding(24.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(msg, color = MaterialTheme.colorScheme.error)
                              Spacer(Modifier.height(12.dp))
                              Button(onClick = { vm.retry() }) { Text("Coba lagi") }
                          }
                      }

                      if (vm.loading) {
                          CircularProgressIndicator(
                              Modifier
                                  .align(if (vm.items.isEmpty()) Alignment.Center else Alignment.BottomCenter)
                                  .padding(16.dp)
                          )
                      }

                      if (!vm.loading && vm.error == null && vm.items.isEmpty()) {
                          Text("Tidak ada hasil", Modifier.align(Alignment.Center))
                      }
                  }
              }

              selected?.let { w ->
                  Detail(w = w, onClose = { selected = null })
              }
          }

          @Composable
          fun Detail(w: Wallpaper, onClose: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var busy by remember { mutableStateOf(false) }

              fun run(okMessage: String, block: suspend () -> Unit) {
                  scope.launch {
                      busy = true
                      val msg = try {
                          block()
                          okMessage
                      } catch (e: Exception) {
                          "Gagal: ${e.message ?: e.javaClass.simpleName}"
                      }
                      busy = false
                      Toast.makeText(ctx, msg, Toast.LENGTH_SHORT).show()
                  }
              }

              val dims = if (w.width > 0 && w.height > 0) " • ${w.width}×${w.height}" else ""
              val by = if (w.author.isNotBlank()) " • ${w.author}" else ""

              Dialog(
                  onDismissRequest = onClose,
                  properties = DialogProperties(usePlatformDefaultWidth = false)
              ) {
                  Surface(Modifier.fillMaxSize(), color = Color.Black) {
                      Box(Modifier.fillMaxSize()) {
                          AsyncImage(
                              model = w.full,
                              contentDescription = null,
                              contentScale = ContentScale.Fit,
                              modifier = Modifier.fillMaxSize()
                          )
                          if (busy) {
                              CircularProgressIndicator(Modifier.align(Alignment.Center))
                          }
                          Column(
                              Modifier
                                  .align(Alignment.BottomCenter)
                                  .fillMaxWidth()
                                  .background(Color(0x99000000))
                                  .navigationBarsPadding()
                                  .padding(12.dp)
                          ) {
                              Text(
                                  "${w.source}$dims$by",
                                  color = Color.White,
                                  style = MaterialTheme.typography.bodySmall
                              )
                              Row(
                                  Modifier.padding(top = 8.dp),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  Button(
                                      enabled = !busy,
                                      onClick = {
                                          run("Tersimpan di Pictures/WallHub") { Saver.saveToGallery(ctx, w) }
                                      }
                                  ) { Text("Simpan") }
                                  Button(
                                      enabled = !busy,
                                      onClick = {
                                          run("Wallpaper dipasang") { Saver.setWallpaper(ctx, w) }
                                      }
                                  ) { Text("Pasang") }
                                  TextButton(onClick = {
                                      ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(w.pageUrl)))
                                  }) { Text("Sumber") }
                              }
                          }
                      }
                  }
              }
          }
          WALLHUB_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          # Opsional: isi di Settings > Secrets and variables > Actions
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: WallHub-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
