name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buat folder app (konfigurasi dan resource)
        run: |
          set -e
          mkdir -p "$(dirname "app/build.gradle.kts")"
          cat > "app/build.gradle.kts" <<'WALLHUB_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.wallhub"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.wallhub"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"

                  // API key opsional, diisi dari GitHub Secrets (atau environment variable saat build lokal).
                  // Kalau kosong, sumber terkait otomatis disembunyikan dari aplikasi.
                  fun key(name: String): String = (System.getenv(name) ?: "").replace("\"", "").trim()
                  buildConfigField("String", "PEXELS_KEY", "\"${key("PEXELS_KEY")}\"")
                  buildConfigField("String", "UNSPLASH_KEY", "\"${key("UNSPLASH_KEY")}\"")
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.03"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          WALLHUB_EOF
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > "app/src/main/AndroidManifest.xml" <<'WALLHUB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SET_WALLPAPER" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.WallHub">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          WALLHUB_EOF
          mkdir -p "$(dirname "app/src/main/res/values/strings.xml")"
          cat > "app/src/main/res/values/strings.xml" <<'WALLHUB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">WallHub</string>
          </resources>
          WALLHUB_EOF
          mkdir -p "$(dirname "app/src/main/res/values/themes.xml")"
          cat > "app/src/main/res/values/themes.xml" <<'WALLHUB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.WallHub" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          WALLHUB_EOF
          mkdir -p "$(dirname "app/src/main/res/values-night/themes.xml")"
          cat > "app/src/main/res/values-night/themes.xml" <<'WALLHUB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.WallHub" parent="android:Theme.Material.NoActionBar" />
          </resources>
          WALLHUB_EOF

      - name: Buat folder app (kode Kotlin)
        run: |
          set -e
          mkdir -p "$(dirname "app/src/main/java/com/example/wallhub/Model.kt")"
          cat > "app/src/main/java/com/example/wallhub/Model.kt" <<'WALLHUB_EOF'
          package com.example.wallhub

          data class Wallpaper(
              val id: String,
              val source: String,
              val thumb: String,
              val full: String,
              val width: Int,
              val height: Int,
              val pageUrl: String,
              val author: String = ""
          )

          data class SearchPage(val items: List<Wallpaper>, val next: String?)

          interface WallSource {
              val name: String
              val enabled: Boolean get() = true

              /** cursor = null untuk halaman pertama; next = null berarti sudah habis. */
              suspend fun search(query: String, cursor: String?, portrait: Boolean): SearchPage
          }
          WALLHUB_EOF
          mkdir -p "$(dirname "app/src/main/java/com/example/wallhub/Http.kt")"
          cat > "app/src/main/java/com/example/wallhub/Http.kt" <<'WALLHUB_EOF'
          package com.example.wallhub

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.Cookie
          import okhttp3.CookieJar
          import okhttp3.HttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.concurrent.TimeUnit

          object Http {
              private const val UA =
                  "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) " +
                      "Chrome/126.0.0.0 Mobile Safari/537.36"

              private val jar = object : CookieJar {
                  private val store = mutableListOf<Cookie>()

                  @Synchronized
                  override fun saveFromResponse(url: HttpUrl, cookies: List<Cookie>) {
                      cookies.forEach { c ->
                          store.removeAll { it.name == c.name && it.domain == c.domain && it.path == c.path }
                          store.add(c)
                      }
                  }

                  @Synchronized
                  override fun loadForRequest(url: HttpUrl): List<Cookie> {
                      val now = System.currentTimeMillis()
                      store.removeAll { it.expiresAt < now }
                      return store.filter { it.matches(url) }
                  }
              }

              val client: OkHttpClient = OkHttpClient.Builder()
                  .cookieJar(jar)
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(30, TimeUnit.SECONDS)
                  .addInterceptor { chain ->
                      val req = chain.request()
                      val b = req.newBuilder()
                      if (req.header("User-Agent") == null) b.header("User-Agent", UA)
                      if (req.header("Accept-Language") == null) b.header("Accept-Language", "en-US,en;q=0.9")
                      chain.proceed(b.build())
                  }
                  .build()

              suspend fun get(url: String, headers: Map<String, String> = emptyMap()): String =
                  withContext(Dispatchers.IO) {
                      val req = Request.Builder().url(url).apply {
                          headers.forEach { (k, v) -> header(k, v) }
                      }.build()
                      client.newCall(req).execute().use { r ->
                          if (!r.isSuccessful) throw IOException("HTTP ${r.code}")
                          r.body?.string().orEmpty()
                      }
                  }

              suspend fun bytes(url: String): ByteArray =
                  withContext(Dispatchers.IO) {
                      val req = Request.Builder().url(url).build()
                      client.newCall(req).execute().use { r ->
                          if (!r.isSuccessful) throw IOException("HTTP ${r.code}")
                          r.body?.bytes() ?: ByteArray(0)
                      }
                  }
          }

          fun JSONArray.objects(): List<JSONObject> = (0 until length()).mapNotNull { optJSONObject(it) }
          WALLHUB_EOF
          mkdir -p "$(dirname "app/src/main/java/com/example/wallhub/Sources.kt")"
          cat > "app/src/main/java/com/example/wallhub/Sources.kt" <<'WALLHUB_EOF'
          package com.example.wallhub

          import okhttp3.HttpUrl
          import org.json.JSONArray
          import org.json.JSONObject

          /** API resmi, gratis, tanpa key. */
          class Wallhaven : WallSource {
              override val name = "Wallhaven"

              override suspend fun search(query: String, cursor: String?, portrait: Boolean): SearchPage {
                  val page = cursor?.toIntOrNull() ?: 1
                  val url = HttpUrl.Builder()
                      .scheme("https").host("wallhaven.cc").addPathSegments("api/v1/search")
                      .addQueryParameter("q", query)
                      .addQueryParameter("page", page.toString())
                      .addQueryParameter("sorting", if (query.isBlank()) "toplist" else "relevance")
                      .addQueryParameter("categories", "111")
                      .addQueryParameter("purity", "100")
                      .apply { if (portrait) addQueryParameter("ratios", "portrait") }
                      .build().toString()

                  val root = JSONObject(Http.get(url))
                  val items = root.optJSONArray("data").orEmpty().objects().map { o ->
                      Wallpaper(
                          id = "wh-" + o.getString("id"),
                          source = name,
                          thumb = o.getJSONObject("thumbs").getString("large"),
                          full = o.getString("path"),
                          width = o.optInt("dimension_x"),
                          height = o.optInt("dimension_y"),
                          pageUrl = o.optString("url")
                      )
                  }
                  val last = root.optJSONObject("meta")?.optInt("last_page", page) ?: page
                  return SearchPage(items, if (page < last) (page + 1).toString() else null)
              }
          }

          /** API resmi, butuh key gratis (PEXELS_KEY). */
          class Pexels(private val key: String) : WallSource {
              override val name = "Pexels"
              override val enabled: Boolean = key.isNotBlank()

              override suspend fun search(query: String, cursor: String?, portrait: Boolean): SearchPage {
                  val page = cursor?.toIntOrNull() ?: 1
                  val url = HttpUrl.Builder()
                      .scheme("https").host("api.pexels.com").addPathSegments("v1/search")
                      .addQueryParameter("query", query.ifBlank { "wallpaper" })
                      .addQueryParameter("page", page.toString())
                      .addQueryParameter("per_page", "30")
                      .apply { if (portrait) addQueryParameter("orientation", "portrait") }
                      .build().toString()

                  val root = JSONObject(Http.get(url, mapOf("Authorization" to key)))
                  val items = root.optJSONArray("photos").orEmpty().objects().map { o ->
                      val src = o.getJSONObject("src")
                      Wallpaper(
                          id = "px-" + o.getLong("id"),
                          source = name,
                          thumb = src.getString("large"),
                          full = src.getString("large2x"),
                          width = o.optInt("width"),
                          height = o.optInt("height"),
                          pageUrl = o.optString("url"),
                          author = o.optString("photographer")
                      )
                  }
                  return SearchPage(items, if (root.has("next_page")) (page + 1).toString() else null)
              }
          }

          /** API resmi, butuh key gratis (UNSPLASH_KEY). */
          class Unsplash(private val key: String) : WallSource {
              override val name = "Unsplash"
              override val enabled: Boolean = key.isNotBlank()

              override suspend fun search(query: String, cursor: String?, portrait: Boolean): SearchPage {
                  val page = cursor?.toIntOrNull() ?: 1
                  val url = HttpUrl.Builder()
                      .scheme("https").host("api.unsplash.com").addPathSegments("search/photos")
                      .addQueryParameter("query", query.ifBlank { "wallpaper" })
                      .addQueryParameter("page", page.toString())
                      .addQueryParameter("per_page", "30")
                      .apply { if (portrait) addQueryParameter("orientation", "portrait") }
                      .build().toString()

                  val root = JSONObject(Http.get(url, mapOf("Authorization" to "Client-ID $key")))
                  val items = root.optJSONArray("results").orEmpty().objects().map { o ->
                      val urls = o.getJSONObject("urls")
                      Wallpaper(
                          id = "us-" + o.getString("id"),
                          source = name,
                          thumb = urls.getString("small"),
                          full = urls.getString("regular"),
                          width = o.optInt("width"),
                          height = o.optInt("height"),
                          pageUrl = o.optJSONObject("links")?.optString("html").orEmpty(),
                          author = o.optJSONObject("user")?.optString("name").orEmpty()
                      )
                  }
                  val total = root.optInt("total_pages", page)
                  return SearchPage(items, if (page < total) (page + 1).toString() else null)
              }
          }

          private fun JSONArray?.orEmpty(): JSONArray = this ?: JSONArray()
          WALLHUB_EOF
          mkdir -p "$(dirname "app/src/main/java/com/example/wallhub/Pinterest.kt")"
          cat > "app/src/main/java/com/example/wallhub/Pinterest.kt" <<'WALLHUB_EOF'
          package com.example.wallhub

          import okhttp3.HttpUrl
          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * Sumber Pinterest lewat endpoint web internal (tanpa API resmi).
           *
           * PERHATIAN: ini tidak resmi, bisa berubah/diblokir kapan saja, dan melanggar ToS Pinterest.
           * Request dikirim langsung dari HP pengguna (bukan lewat server), gambar tidak di-host ulang,
           * dan tiap wallpaper punya tombol "Sumber" yang membuka pin aslinya.
           * Kalau gagal, hanya sumber ini yang error; sumber lain tetap jalan.
           */
          class Pinterest : WallSource {
              override val name = "Pinterest"

              @Volatile
              private var warm = false

              private suspend fun warmUp() {
                  if (warm) return
                  try {
                      Http.get("https://www.pinterest.com/")
                  } catch (_: Exception) {
                      // abaikan; cookie mungkin tetap terisi
                  }
                  warm = true
              }

              override suspend fun search(query: String, cursor: String?, portrait: Boolean): SearchPage {
                  warmUp()

                  val q = if (query.isBlank()) "wallpaper" else "$query wallpaper"
                  val options = JSONObject()
                      .put("query", q)
                      .put("scope", "pins")
                      .put("rs", "typed")
                      .put("page_size", 25)
                  if (cursor != null) options.put("bookmarks", JSONArray().put(cursor))
                  val data = JSONObject().put("options", options).put("context", JSONObject())

                  val url = HttpUrl.Builder()
                      .scheme("https").host("www.pinterest.com")
                      .addPathSegments("resource/BaseSearchResource/get/")
                      .addQueryParameter("source_url", "/search/pins/?q=$q")
                      .addQueryParameter("data", data.toString())
                      .addQueryParameter("_", System.currentTimeMillis().toString())
                      .build().toString()

                  val body = Http.get(
                      url,
                      mapOf(
                          "Accept" to "application/json, text/javascript, */*, q=0.01",
                          "X-Requested-With" to "XMLHttpRequest",
                          "X-Pinterest-AppState" to "active",
                          "Referer" to "https://www.pinterest.com/"
                      )
                  )

                  val resp = JSONObject(body).optJSONObject("resource_response")
                      ?: throw IllegalStateException("Format respons Pinterest berubah")
                  val results = resp.optJSONObject("data")?.optJSONArray("results") ?: JSONArray()

                  val items = results.objects().mapNotNull { o ->
                      val id = o.optString("id")
                      if (id.isBlank()) return@mapNotNull null
                      val imgs = o.optJSONObject("images") ?: return@mapNotNull null
                      val big = imgs.optJSONObject("orig") ?: imgs.optJSONObject("736x") ?: return@mapNotNull null
                      val small = imgs.optJSONObject("474x") ?: imgs.optJSONObject("236x") ?: big
                      val w = big.optInt("width")
                      val h = big.optInt("height")
                      if (portrait && h < w) return@mapNotNull null
                      Wallpaper(
                          id = "pin-$id",
                          source = name,
                          thumb = small.optString("url"),
                          full = big.optString("url"),
                          width = w,
                          height = h,
                          pageUrl = "https://www.pinterest.com/pin/$id/",
                          author = o.optJSONObject("pinner")?.optString("full_name").orEmpty()
                      )
                  }

                  val bookmark = resp.optString("bookmark")
                  val next = bookmark.takeIf { it.isNotBlank() && it != "-end-" }
                  return SearchPage(items, next)
              }
          }
          WALLHUB_EOF
          mkdir -p "$(dirname "app/src/main/java/com/example/wallhub/MainViewModel.kt")"
          cat > "app/src/main/java/com/example/wallhub/MainViewModel.kt" <<'WALLHUB_EOF'
          package com.example.wallhub

          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.launch

          class MainViewModel : ViewModel() {
              val sources: List<WallSource> = listOf(
                  Wallhaven(),
                  Pinterest(),
                  Pexels(BuildConfig.PEXELS_KEY),
                  Unsplash(BuildConfig.UNSPLASH_KEY)
              ).filter { it.enabled }

              var query by mutableStateOf("")
              var source by mutableStateOf(sources.first())
                  private set
              var portrait by mutableStateOf(true)
                  private set
              var items by mutableStateOf<List<Wallpaper>>(emptyList())
                  private set
              var loading by mutableStateOf(false)
                  private set
              var error by mutableStateOf<String?>(null)
                  private set
              var refreshKey by mutableIntStateOf(0)
                  private set

              private var cursor: String? = null
              private var hasMore = true
              private var job: Job? = null
              private var gen = 0

              init {
                  refresh()
              }

              fun select(s: WallSource) {
                  source = s
                  refresh()
              }

              fun togglePortrait() {
                  portrait = !portrait
                  refresh()
              }

              fun refresh() {
                  gen++
                  job?.cancel()
                  items = emptyList()
                  cursor = null
                  hasMore = true
                  error = null
                  refreshKey++
                  load()
              }

              fun retry() {
                  error = null
                  hasMore = true
                  load()
              }

              fun loadMore() {
                  if (!loading && hasMore && error == null) load()
              }

              private fun load() {
                  val my = gen
                  val src = source
                  val q = query.trim()
                  val p = portrait
                  val c = cursor
                  job = viewModelScope.launch {
                      loading = true
                      try {
                          val page = src.search(q, c, p)
                          if (my != gen) return@launch
                          items = (items + page.items).distinctBy { it.id }
                          cursor = page.next
                          hasMore = page.next != null
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          if (my == gen) {
                              error = "${src.name}: ${e.message ?: e.javaClass.simpleName}"
                              hasMore = false
                          }
                      } finally {
                          if (my == gen) loading = false
                      }
                  }
              }
          }
          WALLHUB_EOF
          mkdir -p "$(dirname "app/src/main/java/com/example/wallhub/Saver.kt")"
          cat > "app/src/main/java/com/example/wallhub/Saver.kt" <<'WALLHUB_EOF'
          package com.example.wallhub

          import android.app.WallpaperManager
          import android.content.ContentValues
          import android.content.Context
          import android.os.Environment
          import android.provider.MediaStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.ByteArrayInputStream

          object Saver {
              private fun extOf(url: String): String {
                  val path = url.substringBefore('?').lowercase()
                  return when {
                      path.endsWith(".png") -> "png"
                      path.endsWith(".webp") -> "webp"
                      else -> "jpg"
                  }
              }

              suspend fun saveToGallery(ctx: Context, w: Wallpaper) = withContext(Dispatchers.IO) {
                  val bytes = Http.bytes(w.full)
                  val ext = extOf(w.full)
                  val mime = when (ext) {
                      "png" -> "image/png"
                      "webp" -> "image/webp"
                      else -> "image/jpeg"
                  }
                  val values = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, "${w.source}_${w.id}.$ext")
                      put(MediaStore.Images.Media.MIME_TYPE, mime)
                      put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/WallHub")
                  }
                  val uri = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                      ?: error("Gagal membuat file di galeri")
                  ctx.contentResolver.openOutputStream(uri)?.use { it.write(bytes) }
                      ?: error("Gagal menulis file")
              }

              suspend fun setWallpaper(ctx: Context, w: Wallpaper) = withContext(Dispatchers.IO) {
                  val bytes = Http.bytes(w.full)
                  WallpaperManager.getInstance(ctx).setStream(ByteArrayInputStream(bytes))
              }
          }
          WALLHUB_EOF
          mkdir -p "$(dirname "app/src/main/java/com/example/wallhub/MainActivity.kt")"
          cat > "app/src/main/java/com/example/wallhub/MainActivity.kt" <<'WALLHUB_EOF'
